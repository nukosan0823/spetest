$schema: "https://json-schema.org/draft/2020-12/schema"
$id: "https://raw.githubusercontent.com/nukosan0823/spetest/main/schemas/impact-analysis.schema.yml"
title: Impact Analysis Artifact
description: >-
  Structural contract for analysis.yml. Cross-reference and semantic no-impact
  rules are enforced by validate_impact_analysis.py.
type: object
additionalProperties: false
required:
  - schemaVersion
  - investigation
  - baseline
  - changeSeeds
  - scope
  - lensCoverage
  - evidence
  - graph
  - impacts
  - findings
  - requiredTests
  - recommendedFollowUps
  - completeness
  - conclusion
properties:
  schemaVersion:
    const: "1.0"
  investigation:
    type: object
    required: [id, title, mode, assuranceLevel]
    properties:
      id: {type: string, pattern: "^INV-[0-9]+$"}
      title: {type: string, minLength: 1}
      mode: {enum: [read_only, investigation_only]}
      assuranceLevel: {enum: [triage, standard, high_assurance]}
  baseline:
    type: object
    required: [repositoryCommit, branch, observedAt, sources]
  changeSeeds:
    type: array
    minItems: 1
  scope:
    type: object
    required: [included, excluded]
  lensCoverage:
    type: array
    minItems: 11
  evidence:
    type: array
  graph:
    type: object
    required: [nodes, edges]
  impacts:
    type: array
  findings:
    type: object
    required: [facts, assumptions, unknowns, conflicts]
  requiredTests:
    type: array
  recommendedFollowUps:
    type: array
  completeness:
    type: object
    required: [status, openFrontiers, unresolvedConflicts]
  conclusion:
    type: object
    required: [outcome, summary, confidence]
